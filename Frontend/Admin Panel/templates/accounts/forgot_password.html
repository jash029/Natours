<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Natours Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; max-width: 440px; width: 100%; }
    </style>
</head>
<body>
    <div class="card-custom p-4 p-md-5">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-white">Reset Staff Password</h4>
            <p class="text-secondary fs-7">Enter your staff email to receive recovery instructions.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-light fs-7">Staff Email Address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold fs-7 mb-3">Send Reset Instructions</button>
            <div class="text-center">
                <a href="{% url 'accounts:login' %}" class="text-secondary fs-8 text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
