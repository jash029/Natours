<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Login | Natours Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #202020;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #000000;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3 p-2" style="width: 48px; height: 48px;">
                <i class="bi bi-compass fs-2"></i>
            </div>
            <h4 class="fw-bold text-white mb-1">Natours Travel</h4>
            <p class="text-secondary fs-7">Enterprise Staff Administration Portal</p>
        </div>

        {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
            <div class="alert text-white bg-dark alert-{{ message.tags|default:'info' }} py-2 px-3 fs-7">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="text-light fs-7 fw-medium" for="id_email_or_username">Staff Email or Username</label>
                {{ form.email_or_username }}
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-light fs-7 fw-medium mb-0" for="id_password">Password</label>
                </div>
                {{ form.password }}
            </div>
            <div class="form-check mb-4">
                {{ form.remember_me }}
                <label class="form-check-label text-secondary fs-8" for="id_remember_me">
                    Keep me signed in for 30 days
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold fs-7 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Enterprise Portal
            </button>
            <div class="text-center text-secondary fs-8">
                <i class="bi bi-shield-lock me-1"></i> Staff credentials provisioned by Super Admin only.
            </div>
        </form>
    </div><!-- /.login-card -->
</body>
</html>
